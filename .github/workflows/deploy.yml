name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache intentionally omitted — repo uses bun.lock, not package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          BASE_PATH: /RepoLens/
        run: npm run build

      - name: Debug build output
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== dist ==="
          ls -la dist 2>/dev/null || echo "no dist"
          echo "=== dist/client ==="
          ls -la dist/client 2>/dev/null || echo "no dist/client"
          echo "=== .output ==="
          ls -la .output 2>/dev/null || echo "no .output"
          echo "=== All index.html ==="
          find . -name "index.html" -not -path "./node_modules/*" 2>/dev/null | head -20
          echo "=== All .html ==="
          find . -name "*.html" -not -path "./node_modules/*" 2>/dev/null | head -30

      - name: Prepare static files for GitHub Pages
        run: |
          if [ -f "dist/client/index.html" ]; then
            OUT="dist/client"
          elif [ -f "dist/index.html" ]; then
            OUT="dist"
          elif [ -f ".output/public/index.html" ]; then
            OUT=".output/public"
          elif [ -f "dist/client/_shell.html" ]; then
            OUT="dist/client"
            cp dist/client/_shell.html dist/client/index.html
          elif [ -f "dist/_shell.html" ]; then
            OUT="dist"
            cp dist/_shell.html dist/index.html
          else
            echo "ERROR: Could not find index.html"
            find . -name "*.html" -not -path "./node_modules/*" | head -30
            exit 1
          fi

          echo "Using output directory: $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
