name: Deploy RepoLens to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (SPA)
        run: bun run build

      - name: Debug output
        if: always()
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== dist ==="
          ls -la dist 2>/dev/null || echo "no dist"
          echo "=== dist/client ==="
          ls -la dist/client 2>/dev/null || echo "no dist/client"
          echo "=== All index.html / _shell.html ==="
          find . \( -name "index.html" -o -name "_shell.html" \) -not -path "./node_modules/*" 2>/dev/null | head -30

      - name: Prepare SPA for GitHub Pages
        run: |
          if [ -f "dist/client/index.html" ]; then
            OUT="dist/client"
          elif [ -f "dist/client/_shell.html" ]; then
            OUT="dist/client"
            cp dist/client/_shell.html dist/client/index.html
          elif [ -f "dist/index.html" ]; then
            OUT="dist"
          elif [ -f ".output/public/index.html" ]; then
            OUT=".output/public"
          else
            echo "ERROR: No index.html found after build"
            find . -name "*.html" -not -path "./node_modules/*" | head -40
            exit 1
          fi

          echo "Using: $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4